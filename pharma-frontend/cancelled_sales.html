<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
    <script src="./js/navbar_profile.js?v=1"></script>
    <script src="./js/navbar_bootstrap.js?v=13"></script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dr. R Pharmacy | Cancelled Sales</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            rel="stylesheet"
        />
        <link href="./css/navbar.css?v=39" rel="stylesheet" />
        <link href="./css/cashier_workspace.css?v=7" rel="stylesheet" />
        <script src="./js/navbar.js?v=92" defer></script>
        <script type="module" src="./js/modules/auth_guard.js?v=27"></script>
    </head>
    <body data-cashier-page="cancelled">
        <div id="navbar-container"></div>
        <main class="main-wrapper" id="mainWrapper">
            <header class="cashier-topbar">
                <button class="icon-btn" id="sidebarToggle" type="button">
                    <i class="fa-solid fa-bars"></i></button
                ><span class="brand-tile"><i class="fa-solid fa-ban"></i></span>
                <div class="title-wrap">
                    <strong>Cancelled Sales</strong><span>Cancelled or voided sales view</span>
                </div>
            </header>
            <section class="cashier-page">
                <section class="panel">
                    <div class="panel-head">
                        <div>
                            <h1>Cancelled / Voided Sales</h1>
                            <p>Void and refund approvals can be added later.</p>
                        </div>
                    </div>
                    <div class="search-row">
                        <input
                            id="cashierSearch"
                            type="search"
                            placeholder="Search order, customer, sales clerk, or reason"
                        />
                    </div>
                    <div class="table-wrap">
                        <table class="cashier-table">
                            <thead>
                                <tr>
                                    <th>Order No</th>
                                    <th>Customer</th>
                                    <th>Sales Clerk</th>
                                    <th>Cashier</th>
                                    <th>Total Amount</th>
                                    <th>Reason</th>
                                    <th>Cancelled By</th>
                                    <th>Cancelled At</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="reportRows">
                                <tr class="empty-row">
                                    <td colspan="9">Loading cancelled sales...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="./js/modules/cashier_workspace.js?v=9"></script>
    </body>
</html>
