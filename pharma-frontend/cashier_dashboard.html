<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. R Pharmacy | Cashier Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="./css/navbar.css?v=15" rel="stylesheet">
    <link href="./css/cashier_workspace.css?v=3" rel="stylesheet">
    <script src="./js/navbar.js?v=55" defer></script>
    <script type="module" src="./js/modules/auth_guard.js?v=20"></script>
</head>
<body data-cashier-page="dashboard">
    <div id="navbar-container"></div>
    <main class="main-wrapper" id="mainWrapper">
        <header class="cashier-topbar"><button class="icon-btn" id="sidebarToggle" type="button"><i class="fa-solid fa-bars"></i></button><span class="brand-tile"><i class="fa-solid fa-gauge-high"></i></span><div class="title-wrap"><strong>Dashboard</strong><span>Cashier workspace overview</span></div></header>
        <section class="cashier-page">
            <div class="summary-grid">
                <article class="summary-card"><i class="fa-solid fa-hourglass-half"></i><div><span>Waiting Orders</span><strong id="waitingOrders">0</strong></div></article>
                <article class="summary-card"><i class="fa-solid fa-cash-register"></i><div><span>Processing Orders</span><strong id="processingOrders">0</strong></div></article>
                <article class="summary-card"><i class="fa-solid fa-circle-check"></i><div><span>Completed Today</span><strong id="completedToday">0</strong></div></article>
                <article class="summary-card"><i class="fa-solid fa-chart-line"></i><div><span>Total Sales Today</span><strong id="totalSalesToday">₱0.00</strong></div></article>
                <article class="summary-card"><i class="fa-solid fa-money-bill-wave"></i><div><span>Cash Collected Today</span><strong id="cashCollectedToday">₱0.00</strong></div></article>
            </div>
            <div class="workspace-grid">
                <section class="panel"><div class="panel-head"><div><h1>Recent Cashier Activities</h1><p>Latest cashier-side actions</p></div></div><div class="activity-list" id="activityList"></div></section>
                <aside class="panel"><div class="panel-head"><div><h2>Quick Actions</h2><p>Cashier shortcuts</p></div></div><div class="quick-grid">
                    <a class="quick-action" href="cashier_pos.html"><i class="fa-solid fa-cash-register"></i><strong>Open Cashier POS</strong></a>
                    <a class="quick-action" href="completed_sales.html"><i class="fa-solid fa-clock-rotate-left"></i><strong>Transaction History</strong></a>
                    <a class="quick-action" href="cashier_shift_summary.html"><i class="fa-solid fa-calendar-day"></i><strong>View Shift Summary</strong></a>
                </div></aside>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/modules/cashier_workspace.js?v=4"></script>
</body>
</html>
