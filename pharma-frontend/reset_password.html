<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | Dr. R Pharmacy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px"><section class="card shadow-sm border-0 p-4"><h1 class="h4 mb-2">Reset your password</h1><p class="text-muted">Choose a new password for your account.</p><form id="resetForm"><label class="form-label" for="newPassword">New password</label><input class="form-control mb-2" id="newPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><div class="small text-muted mb-2">Enter a password of at least 8 characters, with an uppercase, number and a symbol.</div><label class="form-label" for="confirmPassword">Confirm password</label><input class="form-control mb-3" id="confirmPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><div id="message" class="small mb-3" role="alert"></div><button class="btn btn-primary w-100" type="submit">Reset password</button></form><a class="d-block text-center mt-3" href="login.html">Back to login</a></section></main><script type="module">
import API_BASE_URL from './js/config/config.js';
const form=document.getElementById('resetForm'),message=document.getElementById('message'),token=new URLSearchParams(location.search).get('token')||'';
form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';const newPassword=document.getElementById('newPassword').value;const confirmPassword=document.getElementById('confirmPassword').value;const isStrong=newPassword.length>=8&&newPassword.length<=72&&/[A-Z]/.test(newPassword)&&/\d/.test(newPassword)&&/[^\\w\\s]/.test(newPassword);if(newPassword!==confirmPassword){message.className='small mb-3 text-danger';message.textContent='Passwords do not match.';return;}if(!isStrong){message.className='small mb-3 text-danger';message.textContent='Enter a password of at least 8 characters, with an uppercase, number and a symbol.';return;}const body={token,new_password:newPassword,confirm_password:confirmPassword};try{const response=await fetch(`${API_BASE_URL}/auth/reset_password.php`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to reset password.');message.className='small mb-3 text-success';message.textContent=data.message;form.reset();}catch(error){message.className='small mb-3 text-danger';message.textContent=error.message;}});
</script></body></html>
