<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. R Pharmacy | Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{min-height:100vh;display:grid;place-items:center;margin:0;background:#f4f6fb;font-family:Inter,Arial,sans-serif;color:#101936}.reset-card{width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #e5e9f2;border-radius:12px;background:#fff;box-shadow:0 12px 34px rgba(16,25,54,.08)}.reset-card h1{margin:0;font-size:22px;font-weight:850}.reset-card p{color:#667085;font-size:13px}.reset-card label{display:grid;gap:6px;margin-top:14px;color:#475467;font-size:12px;font-weight:800}.reset-card input{min-height:40px;border:1px solid #cfd6e3;border-radius:7px;padding:8px 10px;font:inherit}.reset-card button{width:100%;margin-top:18px}.message{margin-top:14px;padding:10px;border-radius:7px;font-size:12px;font-weight:700}.message.error{color:#b42318;background:#fef3f2}.message.success{color:#166534;background:#f0fdf4}</style>
</head>
<body>
    <main class="reset-card">
        <h1>Reset Password</h1>
        <p>Choose a new password for your Dr. R Pharmacy account.</p>
        <form id="resetPasswordForm" novalidate>
            <label>New Password<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
            <label>Confirm Password<input name="confirm_password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
            <button class="btn btn-primary" type="submit">Set New Password</button>
        </form>
        <div id="resetMessage" class="message" hidden></div>
    </main>
    <script type="module" src="./js/modules/reset_password.js?v=1"></script>
</body>
</html>
