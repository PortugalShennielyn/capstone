<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. R Pharmacy | Cashier POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <link href="./css/navbar.css?v=15" rel="stylesheet">
    <link href="./css/cashier_pos.css?v=8" rel="stylesheet">
    <script src="./js/navbar.js?v=55" defer></script>
    <script type="module" src="./js/modules/auth_guard.js?v=20"></script>
</head>
<body>
    <div id="navbar-container"></div>
    <main class="main-wrapper" id="mainWrapper">
        <header class="cashier-topbar">
            <div class="topbar-left">
                <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="page-title">
                    <strong>Cashier POS</strong>
                    <span>Receive sales clerk orders and process customer payments.</span>
                </div>
            </div>
            <button class="icon-btn" id="refreshCashierBtn" type="button" aria-label="Refresh orders" title="Refresh orders">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </header>

        <section class="cashier-page">
            <div class="summary-grid" aria-label="Cashier summary">
                <article class="summary-card">
                    <span><i class="fa-solid fa-hourglass-half"></i></span>
                    <div><strong id="summaryWaiting">0</strong><small>Waiting Orders</small></div>
                </article>
                <article class="summary-card">
                    <span><i class="fa-solid fa-cash-register"></i></span>
                    <div><strong id="summaryProcessing">0</strong><small>Processing Orders</small></div>
                </article>
                <article class="summary-card">
                    <span><i class="fa-solid fa-circle-check"></i></span>
                    <div><strong id="summaryCompleted">0</strong><small>Completed Today</small></div>
                </article>
                <article class="summary-card">
                    <span><i class="fa-solid fa-peso-sign"></i></span>
                    <div><strong id="summarySales">₱0.00</strong><small>Total Sales Today</small></div>
                </article>
            </div>

            <div class="cashier-workspace">
                <section class="queue-panel" aria-label="Order queue">
                    <div class="panel-head">
                        <div>
                            <h1>Order Queue</h1>
                            <p>Orders sent by Sales Clerk</p>
                        </div>
                    </div>
                    <div class="queue-tools">
                        <label class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input id="cashierSearch" type="search" placeholder="Search order, customer, or sales clerk">
                        </label>
                        <div class="queue-tabs" role="tablist" aria-label="Queue filters">
                            <button class="queue-tab active" type="button" data-cashier-tab="waiting">Waiting</button>
                            <button class="queue-tab" type="button" data-cashier-tab="processing">Processing</button>
                        </div>
                    </div>
                    <div class="order-list" id="cashierOrderList" aria-live="polite"></div>
                </section>

                <section class="detail-panel" id="cashierDetailPanel" aria-label="Order payment details">
                    <div class="empty-detail">
                        <span><i class="fa-solid fa-receipt"></i></span>
                        <strong>Select an order from the queue.</strong>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <section id="cashierReceiptPrintArea" aria-hidden="true"></section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script type="module" src="./js/modules/cashier_pos.js?v=10"></script>
</body>
</html>
