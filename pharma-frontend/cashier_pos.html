<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <script src="./js/navbar_profile.js?v=1"></script>
    <script src="./js/navbar_bootstrap.js?v=12"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. R Pharmacy | Cashier POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <link href="./css/navbar.css?v=37" rel="stylesheet">
    <link href="./css/cashier_pos.css?v=13" rel="stylesheet">
    <script src="./js/navbar.js?v=85" defer></script>
    <script type="module" src="./js/modules/auth_guard.js?v=27"></script>
</head>
<body>
    <div id="navbar-container"></div>
    <main class="main-wrapper" id="mainWrapper">
        <header class="topbar cashier-topbar">
            <div class="topbar-left">
                <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="page-title-mini">
                    <strong>Cashier POS</strong>
                    <span>Cashier POS</span>
                </div>
            </div>
            <div class="topbar-right"></div>
        </header>

        <section class="cashier-page">
            <div class="cashier-workspace">
                <section class="queue-panel" aria-label="Order queue">
                    <div class="panel-head">
                        <div>
                            <h1>Order Queue</h1>
                            <p>Orders sent by Sales Clerk</p>
                        </div>
                    </div>
                    <div class="queue-tools">
                        <label class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input id="cashierSearch" name="cashier_order_search_query" type="search" autocomplete="off" spellcheck="false" placeholder="Search order, customer, or sales clerk">
                        </label>
                        <div class="queue-tabs" role="tablist" aria-label="Queue filters">
                            <button class="queue-tab active" type="button" data-cashier-tab="waiting">Waiting <span class="queue-count" id="waitingCount">0</span></button>
                            <button class="queue-tab" type="button" data-cashier-tab="processing">Processing <span class="queue-count" id="processingCount">0</span></button>
                        </div>
                    </div>
                    <div class="order-list" id="cashierOrderList" aria-live="polite"></div>
                </section>

                <section class="detail-panel" id="cashierDetailPanel" aria-label="Order payment details">
                    <div class="empty-detail">
                        <span><i class="fa-solid fa-receipt"></i></span>
                        <strong>Select an order from the queue.</strong>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <section id="cashierReceiptPrintArea" aria-hidden="true"></section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script type="module" src="./js/modules/cashier_pos.js?v=14"></script>
</body>
</html>
