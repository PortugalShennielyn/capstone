<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | Dr. R Pharmacy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f6fb}.card{max-width:480px;margin:12vh auto 0}</style></head>
<body><main class="container"><section class="card shadow-sm border-0 p-4"><h1 class="h4">Forgot your password?</h1><p class="text-muted">Enter the email address linked to your account. If it is registered, we will send a verification link.</p><form id="requestForm"><label class="form-label" for="email">Email address</label><input class="form-control mb-3" id="email" type="email" required autocomplete="email"><div id="message" class="small mb-3" role="alert"></div><button class="btn btn-primary w-100" type="submit">Send reset link</button></form><a class="d-block text-center mt-3" href="login.html">Back to login</a></section></main><script type="module">
import API_BASE_URL from './js/config/config.js';
const form=document.getElementById('requestForm'),message=document.getElementById('message');
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const response=await fetch(`${API_BASE_URL}/auth/request_password_reset.php`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to send reset link.');message.className='small mb-3 text-success';message.textContent=data.message;form.reset();}catch(error){message.className='small mb-3 text-danger';message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
