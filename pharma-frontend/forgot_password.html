
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Dr. R Pharmacy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #f0e5ff, #f4f6fb, #eeeaff);
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 36px 34px;
            border: 1px solid #e8eaf2;
            border-radius: 18px;
            background: rgba(255,255,255,.96);
            box-shadow: 0 20px 55px rgba(50,35,90,.12);
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 16px;
            color: white;
            font-size: 24px;
            background: linear-gradient(135deg, #8b2be2, #ad4df2);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            font-weight: 750;
            color: #292d38;
        }

        .subtitle {
            margin-bottom: 24px;
            text-align: center;
            color: #7b8496;
            font-size: 14px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #454b5b;
        }

        .form-control {
            min-height: 48px;
            background: #f6f7fc;
            border-color: #e0e4ef;
        }

        .form-control:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 .2rem rgba(139,43,226,.12);
        }

        .btn-purple {
            min-height: 48px;
            color: white;
            font-weight: 700;
            border: 0;
            background: #8b2be2;
        }

        .btn-purple:hover {
            color: white;
            background: #7620c7;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #8b2be2;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #formMessage {
            display: none;
            overflow-wrap: anywhere;
        }

        .step-section {
            display: none;
        }

        .step-section.active {
            display: block;
        }

        .step-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #454b5b;
        }
    </style>
</head>

<body>
<main class="reset-card">
    <div class="brand-icon">
        <i class="fa-solid fa-prescription-bottle-medical"></i>
    </div>

    <h1>Forgot Password?</h1>
    <p class="subtitle">
        Reset your Dr. R Pharmacy account password securely.
    </p>

    <div id="formMessage" class="alert" role="alert"
         aria-live="polite"></div>

    <!-- STEP 1: EMAIL -->
    <section id="emailStep" class="step-section active">
        <p class="step-title">Step 1: Request verification code</p>

        <form id="sendCodeForm">
            <div class="mb-4">
                <label for="email" class="form-label">
                    Registered Email
                </label>
                <input type="email" class="form-control"
                       id="email" name="email"
                       placeholder="Enter your registered email"
                       autocomplete="email" required>
            </div>

            <button type="submit" id="sendCodeBtn"
                    class="btn btn-purple w-100">
                <i class="fa-regular fa-paper-plane me-2"></i>
                Send Verification Code
            </button>
        </form>
    </section>

    <!-- STEP 2: OTP + NEW PASSWORD -->
    <section id="resetStep" class="step-section">
        <p class="step-title">Step 2: Verify code and reset password</p>

        <p class="text-muted small">
            Enter the 6-digit code sent to your email and choose a new
            password. The code expires after 10 minutes.
        </p>

        <form id="resetForm">
            <div class="mb-3">
                <label for="otp" class="form-label">
                    6-Digit Verification Code
                </label>
                <input type="text" class="form-control"
                       id="otp" name="code"
                       placeholder="Enter 6-digit code"
                       inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{6}" maxlength="6"
                       minlength="6" required>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label">
                    New Password
                </label>
                <input type="password" class="form-control"
                       id="newPassword" name="new_password"
                       placeholder="At least 8 characters"
                       minlength="8" autocomplete="new-password"
                       required>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">
                    Confirm New Password
                </label>
                <input type="password" class="form-control"
                       id="confirmPassword" name="confirm_password"
                       placeholder="Re-enter new password"
                       minlength="8" autocomplete="new-password"
                       required>
            </div>

            <button type="submit" id="resetBtn"
                    class="btn btn-purple w-100">
                <i class="fa-solid fa-lock me-2"></i>
                Verify Code & Reset Password
            </button>

            <button type="button" id="resendBtn"
                    class="btn btn-outline-secondary w-100 mt-2">
                Resend Verification Code
            </button>
        </form>
    </section>

    <a href="login.html" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i>
        Back to Login
    </a>
</main>

<script>
    const SEND_CODE_URL =
        '../pharma-api/v1/auth/send_verification_code.php';

    const RESET_PASSWORD_URL =
        '../pharma-api/v1/auth/reset_password.php';

    const message = document.getElementById('formMessage');
    const emailStep = document.getElementById('emailStep');
    const resetStep = document.getElementById('resetStep');
    const emailInput = document.getElementById('email');

    const sendCodeForm = document.getElementById('sendCodeForm');
    const resetForm = document.getElementById('resetForm');

    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resendBtn = document.getElementById('resendBtn');

    function showMessage(text, type) {
        message.textContent = text;
        message.className = 'alert alert-' + type;
        message.style.display = 'block';
    }

    function setBusy(button, busy, text, icon) {
        button.disabled = busy;
        button.innerHTML = busy
            ? '<span class="spinner-border spinner-border-sm me-2"></span>Please wait...'
            : '<i class="' + icon + ' me-2"></i>' + text;
    }

    async function postJson(url, payload) {
    const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    });

    const rawText = await response.text();

    let data;

    try {
        data = JSON.parse(rawText);
    } catch (error) {
        console.error('Server returned non-JSON response:');
        console.error(rawText);

        return {
            response,
            data: {
                success: false,
                message: 'Server returned an invalid response. Check the browser console for the PHP error.'
            }
        };
    }

    return { response, data };
}

    async function sendCode() {
        const email = emailInput.value.trim();

        if (!email) {
            showMessage('Please enter your registered email.', 'warning');
            return;
        }

        setBusy(sendCodeBtn, true, '', '');

        try {
            const { response, data } =
                await postJson(SEND_CODE_URL, { email });

            if (response.ok && data.success) {
                emailStep.classList.remove('active');
                resetStep.classList.add('active');

                showMessage(
                    data.message || 'Check your email for the verification code.',
                    'success'
                );

                document.getElementById('otp').focus();
            } else {
                showMessage(
                    data.message || 'Unable to send verification code.',
                    'danger'
                );
            }
        } catch (error) {
            console.error(error);
            showMessage(
                'Unable to contact the server. Check XAMPP Apache and the API URL.',
                'danger'
            );
        } finally {
            setBusy(
                sendCodeBtn,
                false,
                'Send Verification Code',
                'fa-regular fa-paper-plane'
            );
        }
    }

    sendCodeForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        await sendCode();
    });

    resendBtn.addEventListener('click', async function () {
        // A new code invalidates the previous unused code.
        document.getElementById('otp').value = '';
        await sendCode();
    });

    document.getElementById('otp').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
    });

    resetForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const code = document.getElementById('otp').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword =
            document.getElementById('confirmPassword').value;

        if (!/^\d{6}$/.test(code)) {
            showMessage('Please enter the 6-digit verification code.', 'warning');
            return;
        }

        if (newPassword.length < 8) {
            showMessage('Password must be at least 8 characters.', 'warning');
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage('Passwords do not match.', 'warning');
            return;
        }

        setBusy(resetBtn, true, '', '');

        try {
            const { response, data } = await postJson(
                RESET_PASSWORD_URL,
                {
                    email: email,
                    code: code,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                }
            );

            if (response.ok && data.success) {
                showMessage(
                    data.message || 'Password reset successfully.',
                    'success'
                );

                resetForm.reset();

                // Allow the success message to be read before redirecting.
                setTimeout(function () {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showMessage(
                    data.message || 'Password reset failed. Check your code and try again.',
                    'danger'
                );
            }
        } catch (error) {
            console.error(error);
            showMessage(
                'Unable to contact the server. Please try again.',
                'danger'
            );
        } finally {
            setBusy(
                resetBtn,
                false,
                'Verify Code & Reset Password',
                'fa-solid fa-lock'
            );
        }
    });
</script>
</body>
</html>
