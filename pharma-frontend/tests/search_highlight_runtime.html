<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Search Highlight Runtime Test</title>
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
    <label for="returnSearch">Search</label>
    <input id="returnSearch" type="search">
    <table id="table-return-damage">
        <thead><tr><th>Reference</th><th>Supplier</th><th>Product</th><th>Issue</th><th>Actions</th></tr></thead>
        <tbody></tbody>
    </table>
    <script src="../js/search_highlight.js?v=2"></script>
    <script>
        const input = document.getElementById('returnSearch');
        const body = document.querySelector('#table-return-damage tbody');

        function renderRows() {
            body.innerHTML = '<tr><td><div class="cell-primary">PO-20260824-155244-4AF0CB</div></td><td><div class="cell-primary">kianen Marketing</div></td><td><div class="cell-primary">EQ Dry Disposable Baby Diapers</div><div class="cell-secondary">EQ • New Born • Pack</div></td><td><div class="cell-primary">Delivery Damage</div></td><td><button id="viewAction" type="button">View</button></td></tr>';
            window.PharmacySearchHighlight.apply(body, input.value);
        }

        input.addEventListener('input', () => window.setTimeout(renderRows, 30));
        document.addEventListener('click', (event) => {
            if (event.target.id === 'viewAction') {
                document.body.dataset.actionClicks = String(Number(document.body.dataset.actionClicks || 0) + 1);
            }
        });
        renderRows();
    </script>
</body>
</html>
