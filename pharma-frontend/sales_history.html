<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. R Pharmacy | Sales History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="./css/navbar.css?v=15" rel="stylesheet">
    <script src="./js/navbar.js?v=35" defer></script>
    <script type="module" src="./js/modules/auth_guard.js?v=8"></script>
    <style>
        body { min-height: 100vh; margin: 0; color: #252b37; background: #f4f6fb; font-family: "Inter", sans-serif; letter-spacing: 0; }
        .topbar { position: sticky; top: 0; z-index: 1020; min-height: 70px; display: flex; align-items: center; gap: 14px; padding: 14px 26px; background: #fff; border-bottom: 1px solid #e8ecf3; }
        .icon-btn { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; color: #4b5563; background: #f4f6fb; }
        .page-body { padding: 28px; }
        .page-header { margin-bottom: 22px; }
        .page-header h1 { margin: 0; font-size: 26px; font-weight: 800; }
        .page-header p { margin: 6px 0 0; color: #667085; font-weight: 500; }
        .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .summary-card, .table-panel { border: 1px solid #e8ecf3; border-radius: 8px; background: #fff; box-shadow: 0 10px 28px rgba(15, 23, 42, .05); }
        .summary-card { padding: 18px; border-top: 3px solid #d8dee9; }
        .summary-card:nth-child(1) { border-top-color: #7c3aed; }
        .summary-card:nth-child(2) { border-top-color: #16a34a; }
        .summary-card:nth-child(3) { border-top-color: #dc2626; }
        .summary-card:nth-child(4) { border-top-color: #d97706; }
        .summary-card span { display: block; color: #667085; font-size: 13px; font-weight: 700; }
        .summary-card strong { display: block; margin-top: 8px; font-size: 24px; font-weight: 800; }
        .table-panel { overflow: hidden; }
        .table-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 18px 20px; border-bottom: 1px solid #e8ecf3; }
        .table-panel-header h2 { margin: 0; font-size: 18px; font-weight: 800; }
        .sales-table-controls { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: nowrap; margin-left: auto; }
        .sales-search { width: clamp(320px, 28vw, 380px); flex: 0 0 auto; }
        .sales-filter { width: 200px; flex: 0 0 200px; }
        .sales-table { min-width: 1080px; margin: 0; table-layout: auto !important; }
        .sales-table th, .sales-table td { text-align: left !important; vertical-align: middle; white-space: nowrap; }
        .sales-table .empty-row td { padding: 28px 16px !important; color: #667085 !important; text-align: center !important; font-weight: 700; }
        @media (max-width: 992px) { .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .page-body { padding: 22px; } }
        @media (max-width: 720px) { .summary-grid { grid-template-columns: 1fr; } .sales-table-controls, .sales-search, .sales-filter { width: 100%; flex-basis: 100%; } .sales-table-controls { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <main class="main-wrapper" id="mainWrapper">
        <header class="topbar">
            <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
            <div><strong>Sales History</strong><div class="text-muted small">Sales & Transactions</div></div>
        </header>
        <section class="page-body">
            <div class="page-header"><h1>Sales History</h1><p>Full searchable sales transaction history.</p></div>
            <div class="summary-grid" aria-label="Sales history summary">
                <div class="summary-card"><span>Transactions</span><strong id="summaryTransactions">0</strong></div>
                <div class="summary-card"><span>Completed Today</span><strong id="summaryCompleted">0</strong></div>
                <div class="summary-card"><span>Cancelled Today</span><strong id="summaryCancelled">0</strong></div>
                <div class="summary-card"><span>Total Sales Today</span><strong id="summarySales">PHP 0.00</strong></div>
            </div>
            <section class="table-panel">
                <div class="table-panel-header">
                    <h2>Transaction History</h2>
                    <div class="sales-table-controls" aria-label="Sales history filters">
                        <input class="form-control form-control-sm sales-search" id="historySearch" type="search" placeholder="Search order no., customer, or staff...">
                        <select class="form-select form-select-sm sales-filter" id="historyStatus" aria-label="Filter by status">
                            <option value="all">All Statuses</option>
                            <option value="draft">Draft</option>
                            <option value="waiting_cashier">Waiting for Cashier</option>
                            <option value="accepted_by_cashier">Accepted by Cashier</option>
                            <option value="processing_payment">Processing Payment</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table sales-table">
                        <thead><tr><th>Date</th><th>Order No.</th><th>Customer</th><th>Sales Clerk</th><th>Cashier</th><th>Total Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="historyBody"><tr class="empty-row"><td colspan="9">Loading sales orders...</td></tr></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API_BASE_URL from './js/config/config.js';
        import verifySession from './js/modules/auth.js';

        const historyBody = document.getElementById('historyBody');
        const searchInput = document.getElementById('historySearch');
        const statusInput = document.getElementById('historyStatus');

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatDate(value) {
            if (!value) return '-';
            const date = new Date(String(value).replace(' ', 'T'));
            return Number.isNaN(date.getTime()) ? value : date.toLocaleString('en-PH', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
        }

        async function apiFetch(path) {
            const token = sessionStorage.getItem('pharma_tab_token') || '';
            const headers = token ? { 'X-Tab-Token': token } : {};
            const response = await fetch(`${API_BASE_URL}/${path}`, { credentials: 'include', cache: 'no-store', headers });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.status === 'error') throw new Error(data.message || 'Request failed.');
            return data.data;
        }

        function renderRows(orders) {
            if (!orders.length) {
                historyBody.innerHTML = '<tr class="empty-row"><td colspan="9">No sales orders found.</td></tr>';
                return;
            }
            historyBody.innerHTML = orders.map(order => `
                <tr>
                    <td>${escapeHtml(formatDate(order.sent_to_cashier_at || order.created_at))}</td>
                    <td>${escapeHtml(order.order_no)}</td>
                    <td>${escapeHtml(order.customer_name || 'Walk-in Customer')}</td>
                    <td>${escapeHtml(order.sales_clerk_name || 'Unassigned')}</td>
                    <td>${escapeHtml(order.cashier_name || '-')}</td>
                    <td>${escapeHtml(order.total_items || 0)}</td>
                    <td>${escapeHtml(order.total_amount || 'PHP 0.00')}</td>
                    <td>${escapeHtml(order.status || '-')}</td>
                    <td><button class="btn btn-sm btn-outline-primary" type="button" data-order-id="${escapeHtml(order.order_id)}">View</button></td>
                </tr>
            `).join('');
        }

        function renderSummary(data) {
            document.getElementById('summaryTransactions').textContent = String(data.orders?.length || 0);
            document.getElementById('summaryCompleted').textContent = String(data.summary?.completed_today_count || 0);
            document.getElementById('summaryCancelled').textContent = String(data.summary?.cancelled_today_count || 0);
            document.getElementById('summarySales').textContent = data.summary?.total_sales_today || 'PHP 0.00';
        }

        async function loadHistory() {
            historyBody.innerHTML = '<tr class="empty-row"><td colspan="9">Loading sales orders...</td></tr>';
            const params = new URLSearchParams({ status: statusInput.value, search: searchInput.value.trim() });
            const data = await apiFetch(`sales/get_sales_clerk_orders.php?${params.toString()}`);
            renderSummary(data);
            renderRows(data.orders || []);
        }

        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadHistory().catch(error => {
                historyBody.innerHTML = `<tr class="empty-row"><td colspan="9">${escapeHtml(error.message)}</td></tr>`;
            }), 250);
        });
        statusInput.addEventListener('change', () => loadHistory().catch(error => {
            historyBody.innerHTML = `<tr class="empty-row"><td colspan="9">${escapeHtml(error.message)}</td></tr>`;
        }));

        await verifySession();
        await loadHistory();
    </script>
</body>
</html>
