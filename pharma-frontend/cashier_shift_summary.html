<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <script src="./js/navbar_profile.js?v=1"></script>
    <script src="./js/navbar_bootstrap.js?v=11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. R Pharmacy | Shift Summary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="./css/navbar.css?v=37" rel="stylesheet">
    <link href="./css/cashier_shift_summary.css?v=3" rel="stylesheet">
    <script src="./js/navbar.js?v=84" defer></script>
    <script type="module" src="./js/modules/auth_guard.js?v=27"></script>
</head>
<body data-cashier-page="shift">
    <div id="navbar-container"></div>

    <main class="main-wrapper" id="mainWrapper">
        <header class="shift-topbar">
            <button class="icon-btn interactive-only" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span class="brand-tile"><i class="fa-solid fa-calendar-day"></i></span>
            <div class="title-wrap">
                <strong>Shift Summary</strong>
                <span>Review cashier activity, payment totals, and completed transactions.</span>
            </div>
            <div class="header-controls interactive-only" aria-label="Shift summary filters">
                <select class="cashier-select" id="cashierSelect" aria-label="Select cashier" hidden>
                    <option value="">Select cashier</option>
                </select>
                <span class="cashier-identity" id="cashierIdentity" hidden><i class="fa-solid fa-user"></i><span>My Shift</span></span>
                <div class="date-range-wrap">
                    <button class="date-range-control" id="dateRangeButton" type="button" aria-expanded="false" aria-controls="dateRangePopover">
                        <i class="fa-regular fa-calendar"></i>
                        <span id="dateRangeLabel">Date Range</span>
                    </button>
                    <div class="date-range-popover" id="dateRangePopover" hidden>
                        <div class="date-popover-head">
                            <strong>Date Range</strong>
                            <span id="dateRangeValidation" aria-live="polite"></span>
                        </div>
                        <div class="date-range-fields">
                            <label>
                                <span>Start Date</span>
                                <input id="dateRangeStart" type="date">
                            </label>
                            <label>
                                <span>End Date</span>
                                <input id="dateRangeEnd" type="date">
                            </label>
                        </div>
                        <div class="quick-ranges" aria-label="Quick ranges">
                            <button type="button" data-range-shortcut="today">Today</button>
                            <button type="button" data-range-shortcut="yesterday">Yesterday</button>
                            <button type="button" data-range-shortcut="last7">Last 7 Days</button>
                            <button type="button" data-range-shortcut="month">This Month</button>
                        </div>
                        <div class="date-range-actions">
                            <button class="date-cancel" id="dateRangeCancel" type="button">Cancel</button>
                            <button class="date-apply" id="dateRangeApply" type="button">Apply</button>
                        </div>
                    </div>
                </div>
                <button class="print-button" id="printShiftSummary" type="button" disabled>
                    <i class="fa-solid fa-print"></i><span>Print</span>
                </button>
            </div>
        </header>

        <section class="shift-page" id="shiftPage" aria-live="polite" aria-busy="true">
            <div class="loading-card" role="status">
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span>Loading shift summary...</span>
            </div>
        </section>
    </main>

    <div class="shift-modal interactive-only" id="transactionDetailModal" hidden>
        <div class="shift-modal-backdrop" data-close-transaction-modal></div>
        <section class="shift-modal-panel" role="dialog" aria-modal="true" aria-labelledby="transactionModalTitle">
            <header class="shift-modal-header">
                <div>
                    <span class="eyebrow">Transaction details</span>
                    <h2 id="transactionModalTitle">Receipt</h2>
                </div>
                <button type="button" class="modal-close" data-close-transaction-modal aria-label="Close transaction details">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>
            <div class="shift-modal-body" id="transactionModalBody"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/modules/cashier_shift_summary.js?v=4"></script>
</body>
</html>
