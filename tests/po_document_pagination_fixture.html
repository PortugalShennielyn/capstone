<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PO Pagination Fixture</title><link rel="stylesheet" href="../pharma-frontend/css/purchase_order_document.css?v=1"></head>
<body class="embed"><main class="po-pages" id="purchaseOrder"></main><output id="result" hidden></output>

import { renderPurchaseOrderDocument } from '../pharma-frontend/js/modules/purchase_order_document.js?v=2';

document.getElementById('result').value=JSON.stringify(result);
</script></body></html>
